<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <rect width="1400" height="900" fill="#f4f0e8"/>
  <defs>
    <pattern id="grain" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="3" r="1" fill="#151515" opacity="0.055"/>
      <circle cx="7" cy="6" r="1" fill="#151515" opacity="0.04"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#2b251e" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1400" height="900" fill="url(#grain)"/>

  <text x="80" y="92" font-family="Microsoft YaHei, Arial" font-size="18" font-weight="700" fill="#315f8c">CONTENT AI PROTOTYPE</text>
  <text x="80" y="162" font-family="Microsoft YaHei, Arial" font-size="64" font-weight="800" fill="#151515">片前助手</text>
  <text x="82" y="205" font-family="Microsoft YaHei, Arial" font-size="24" fill="#696969">输入主题和素材，点击生成，得到一份可以直接开剪的前期清单。</text>

  <rect x="80" y="255" width="500" height="560" rx="22" fill="#fffdf8" stroke="#d8d0c5" filter="url(#shadow)"/>
  <text x="112" y="312" font-family="Microsoft YaHei, Arial" font-size="30" font-weight="800" fill="#151515">输入</text>

  <text x="112" y="365" font-family="Microsoft YaHei, Arial" font-size="18" font-weight="700" fill="#696969">内容主题</text>
  <rect x="112" y="382" width="430" height="54" rx="12" fill="#ffffff" stroke="#d8d0c5"/>
  <text x="132" y="416" font-family="Microsoft YaHei, Arial" font-size="18" fill="#151515">校园咖啡店探店，15秒短视频</text>

  <text x="112" y="478" font-family="Microsoft YaHei, Arial" font-size="18" font-weight="700" fill="#696969">已有素材</text>
  <rect x="112" y="495" width="430" height="104" rx="12" fill="#ffffff" stroke="#d8d0c5"/>
  <text x="132" y="532" font-family="Microsoft YaHei, Arial" font-size="18" fill="#151515">门口招牌、咖啡制作、座位环境</text>
  <text x="132" y="566" font-family="Microsoft YaHei, Arial" font-size="18" fill="#151515">缺少菜单近景和路线画面</text>

  <text x="112" y="641" font-family="Microsoft YaHei, Arial" font-size="18" font-weight="700" fill="#696969">发布平台</text>
  <rect x="112" y="658" width="205" height="52" rx="12" fill="#ffffff" stroke="#d8d0c5"/>
  <text x="132" y="691" font-family="Microsoft YaHei, Arial" font-size="18" fill="#151515">小红书 / 抖音</text>

  <text x="337" y="641" font-family="Microsoft YaHei, Arial" font-size="18" font-weight="700" fill="#696969">目标</text>
  <rect x="337" y="658" width="205" height="52" rx="12" fill="#ffffff" stroke="#d8d0c5"/>
  <text x="357" y="691" font-family="Microsoft YaHei, Arial" font-size="18" fill="#151515">收藏，下次去</text>

  <rect x="112" y="742" width="430" height="58" rx="29" fill="#151515"/>
  <text x="227" y="779" font-family="Microsoft YaHei, Arial" font-size="21" font-weight="800" fill="#fffdf8">生成剪辑前期方案</text>

  <path d="M610 535 C665 535 665 535 720 535" stroke="#315f8c" stroke-width="4" fill="none"/>
  <path d="M704 518 L724 535 L704 552" stroke="#315f8c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="625" y="510" font-family="Microsoft YaHei, Arial" font-size="18" font-weight="700" fill="#315f8c">点击生成</text>

  <rect x="760" y="255" width="560" height="560" rx="22" fill="#fffdf8" stroke="#d8d0c5" filter="url(#shadow)"/>
  <text x="792" y="312" font-family="Microsoft YaHei, Arial" font-size="30" font-weight="800" fill="#151515">输出</text>
  <text x="1240" y="310" font-family="Microsoft YaHei, Arial" font-size="18" font-weight="800" fill="#b8624f">已生成</text>

  <rect x="792" y="344" width="486" height="74" rx="12" fill="#f5f1ea" stroke="#d8d0c5"/>
  <rect x="792" y="344" width="6" height="74" rx="3" fill="#315f8c"/>
  <text x="816" y="375" font-family="Microsoft YaHei, Arial" font-size="19" font-weight="800" fill="#315f8c">脚本骨架</text>
  <text x="930" y="375" font-family="Microsoft YaHei, Arial" font-size="18" fill="#151515">开头给安静座位，中段展示价格和距离，</text>
  <text x="930" y="403" font-family="Microsoft YaHei, Arial" font-size="18" fill="#151515">结尾引导收藏。</text>

  <rect x="792" y="438" width="486" height="74" rx="12" fill="#f5f1ea" stroke="#d8d0c5"/>
  <rect x="792" y="438" width="6" height="74" rx="3" fill="#315f8c"/>
  <text x="816" y="469" font-family="Microsoft YaHei, Arial" font-size="19" font-weight="800" fill="#315f8c">分镜清单</text>
  <text x="930" y="469" font-family="Microsoft YaHei, Arial" font-size="18" fill="#151515">招牌 → 座位 → 菜单 → 咖啡 → 路线 →</text>
  <text x="930" y="497" font-family="Microsoft YaHei, Arial" font-size="18" fill="#151515">结尾卡片。</text>

  <rect x="792" y="532" width="486" height="74" rx="12" fill="#f5f1ea" stroke="#d8d0c5"/>
  <rect x="792" y="532" width="6" height="74" rx="3" fill="#315f8c"/>
  <text x="816" y="563" font-family="Microsoft YaHei, Arial" font-size="19" font-weight="800" fill="#315f8c">补拍提醒</text>
  <text x="930" y="563" font-family="Microsoft YaHei, Arial" font-size="18" fill="#151515">菜单近景、从宿舍到门店的路、店内</text>
  <text x="930" y="591" font-family="Microsoft YaHei, Arial" font-size="18" fill="#151515">插座位置。</text>

  <rect x="792" y="638" width="150" height="120" rx="12" fill="#ffffff" stroke="#d8d0c5"/>
  <rect x="960" y="638" width="150" height="120" rx="12" fill="#ffffff" stroke="#d8d0c5"/>
  <rect x="1128" y="638" width="150" height="120" rx="12" fill="#ffffff" stroke="#d8d0c5"/>
  <text x="814" y="674" font-family="Microsoft YaHei, Arial" font-size="18" font-weight="800" fill="#315f8c">封面标题</text>
  <text x="814" y="706" font-family="Microsoft YaHei, Arial" font-size="16" fill="#151515">学校附近能坐</text>
  <text x="814" y="730" font-family="Microsoft YaHei, Arial" font-size="16" fill="#151515">一下午的店</text>
  <text x="982" y="674" font-family="Microsoft YaHei, Arial" font-size="18" font-weight="800" fill="#315f8c">字幕层级</text>
  <text x="982" y="706" font-family="Microsoft YaHei, Arial" font-size="16" fill="#151515">结论优先</text>
  <text x="982" y="730" font-family="Microsoft YaHei, Arial" font-size="16" fill="#151515">细节补充</text>
  <text x="1150" y="674" font-family="Microsoft YaHei, Arial" font-size="18" font-weight="800" fill="#315f8c">发布复盘</text>
  <text x="1150" y="706" font-family="Microsoft YaHei, Arial" font-size="16" fill="#151515">看收藏率</text>
  <text x="1150" y="730" font-family="Microsoft YaHei, Arial" font-size="16" fill="#151515">和前3秒</text>
</svg>
